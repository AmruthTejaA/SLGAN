
name: Build SLGAN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify source ZIP
        shell: bash
        run: |
          test -f SLGAN-Android-Source-Fixed.zip
          unzip -q SLGAN-Android-Source-Fixed.zip -d source

      
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p source
          unzip -oq SLGAN-Android-Source-Fixed.zip -d source
          test -f source/SLGAN/settings.gradle.kts
          test -f source/SLGAN/app/build.gradle.kts
          test -f source/SLGAN/app/src/main/AndroidManifest.xml


      
      - name: Fix Kotlin package name
        working-directory: source/SLGAN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix.lower() not in {
                  ".kt", ".kts", ".xml", ".gradle", ".properties"
              }:
                  continue
              try:
                  old = p.read_text()
              except UnicodeDecodeError:
                  continue

              new = old.replace(
                  "in.slgan.app", "com.slgan.app"
              )
              if new != old:
                  p.write_text(new)
                  print("Fixed:", p)
          PY

      - name: Fix Java and Kotlin JVM targets
        working-directory: source/SLGAN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Ensure Java and Kotlin both target JVM 17.
          if "compileOptions" not in s:
              s = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          ''',
                  s,
                  count=1
              )

          if "kotlinOptions" not in s:
              s = re.sub(
                  r'(android\s*\{)',
                  r'''\1
              kotlinOptions {
                  jvmTarget = "17"
              }
          ''',
                  s,
                  count=1
              )

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('jvmTarget = "8"', 'jvmTarget = "17"')

          p.write_text(s)
          print(s)
          PY
          
      - name: Build debug APK
        working-directory: source/SLGAN
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="source/SLGAN/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLGAN-debug-APK
          path: source/SLGAN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
